<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeeMack Clicker</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    #count {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
    }
    #label {
      font-size: 24px;
      margin: 8px 0 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #555;
    }
    #clicker {
      width: min(320px, 80vw);
      cursor: pointer;
      border-radius: 16px;
      transition: transform 0.1s ease-out;
      -webkit-tap-highlight-color: transparent;
    }
    #clicker.pressed {
      transform: scale(0.9);
    }
    .blocked-pop {
      position: fixed;
      pointer-events: none;
      font-weight: 900;
      font-size: 28px;
      color: #d62828;
      letter-spacing: 1px;
      transform: translate(-50%, -50%);
      animation: fall 1.8s ease-in forwards;
      z-index: 10;
    }
    @keyframes fall {
      0%   { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + 220px)) rotate(var(--rot-end)); }
    }
  </style>
</head>
<body>
  <div id="count">0</div>
  <div id="label">Games Blocked</div>
  <img id="clicker" src="deemack.png" alt="Click me!" draggable="false">

  <script>
    const countEl = document.getElementById('count');
    const img = document.getElementById('clicker');

    let count = 0;
    try { count = parseInt(localStorage.getItem('gamesBlocked'), 10) || 0; } catch (e) {}
    countEl.textContent = count.toLocaleString();

    function spawnBlocked(x, y) {
      const el = document.createElement('div');
      el.className = 'blocked-pop';
      el.textContent = 'BLOCKED';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      const rot = (Math.random() * 20 - 10);
      el.style.setProperty('--rot', rot + 'deg');
      el.style.setProperty('--rot-end', (rot + Math.random() * 40 - 20) + 'deg');
      el.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      el.addEventListener('animationend', () => el.remove());
      document.body.appendChild(el);
    }

    img.addEventListener('pointerdown', (e) => {
      spawnBlocked(e.clientX, e.clientY);
      count++;
      countEl.textContent = count.toLocaleString();
      try { localStorage.setItem('gamesBlocked', count); } catch (e) {}
      img.classList.add('pressed');
    });

    const release = () => img.classList.remove('pressed');
    img.addEventListener('pointerup', release);
    img.addEventListener('pointerleave', release);
    img.addEventListener('pointercancel', release);
  </script>
</body>
</html>
